[project]
name = "ecommerce-operation-assistant-api"
version = "0.1.0"
description = "FastAPI backend for Ecommerce Operation Assistant."
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "celery[redis]",
  "cryptography",
  "fastapi",
  "httpx",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "opentelemetry-api",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-sdk",
  "psycopg[binary,pool]",
  "pydantic-settings",
  "pymysql",
  "python-multipart",
  "sqlalchemy",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_operation_assistant_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]