<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>电商运营 · 动态壁纸</title>
<style>
/* ============================================================
   电商运营 · 动态磨砂壁纸
   主题：销售趋势 / 成交柱状 / 指标环 / 商品包裹
   全部为图形与动画，画面中不含任何文字。

   层次：
     ① base      冷灰基底渐变
     ② blob ×5   柔光斑缓慢漂移 —— 磨砂的"雾"
     ③ band      横向柔光带浮动
     ④ svg.scene 电商数据场景（柱状图 / 指标环 / 趋势曲线 / 立方体）
     ⑤ sheen     斜向高光掠动
     ⑥ grain     颗粒抖动 —— 磨砂核心
     ⑦ vignette  暗角
   ============================================================ */

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:#dfe4ea;}

.stage{
  position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(158deg,#f1f3f6 0%,#e3e7ec 34%,#d0d7e0 68%,#bfc7d3 100%);
}
.stage > span{position:absolute;display:block;pointer-events:none;}

/* ---------- ② 漂移光斑 ---------- */
.blob{border-radius:50%;filter:blur(70px);will-change:transform;}

.blob--1{
  width:70vw;height:70vw;left:-22vw;top:-28vw;
  background:radial-gradient(circle at 42% 42%, rgba(255,255,255,.98), rgba(255,255,255,0) 70%);
  animation:blob1 62s ease-in-out infinite;
}
.blob--2{
  width:56vw;height:56vw;right:-18vw;top:-14vw;
  background:radial-gradient(circle at 50% 50%, rgba(16,185,129,.09), rgba(16,185,129,0) 66%);
  animation:blob2 76s ease-in-out infinite;
}
.blob--3{
  width:82vw;height:82vw;left:6vw;bottom:-44vw;
  background:radial-gradient(circle at 50% 50%, rgba(84,100,122,.36), rgba(84,100,122,0) 70%);
  animation:blob3 94s ease-in-out infinite;
}
.blob--4{
  width:44vw;height:44vw;right:-8vw;bottom:-16vw;
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.84), rgba(255,255,255,0) 68%);
  animation:blob4 68s ease-in-out infinite;
}
.blob--5{
  width:34vw;height:34vw;left:34vw;top:14vh;
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.60), rgba(255,255,255,0) 66%);
  animation:blob5 84s ease-in-out infinite;
}

@keyframes blob1{
  0%,100%{transform:translate3d(0,0,0) scale(1);}
  34%{transform:translate3d(12%,10%,0) scale(1.16);}
  67%{transform:translate3d(-7%,15%,0) scale(.92);}
}
@keyframes blob2{
  0%,100%{transform:translate3d(0,0,0) scale(1);}
  30%{transform:translate3d(-14%,12%,0) scale(1.12);}
  64%{transform:translate3d(-5%,-11%,0) scale(.88);}
}
@keyframes blob3{
  0%,100%{transform:translate3d(0,0,0) scale(1);}
  42%{transform:translate3d(13%,-9%,0) scale(1.14);}
  72%{transform:translate3d(-8%,-15%,0) scale(.94);}
}
@keyframes blob4{
  0%,100%{transform:translate3d(0,0,0) scale(1);}
  38%{transform:translate3d(-11%,-13%,0) scale(1.1);}
  70%{transform:translate3d(8%,-5%,0) scale(.9);}
}
@keyframes blob5{
  0%,100%{transform:translate3d(0,0,0) scale(1);opacity:.85;}
  45%{transform:translate3d(9%,12%,0) scale(1.18);opacity:1;}
  78%{transform:translate3d(-10%,5%,0) scale(.94);opacity:.7;}
}

/* ---------- ③ 横向柔光带 ---------- */
.band{
  left:-10%;width:120%;height:32vh;
  background:linear-gradient(180deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.5) 46%,
    rgba(255,255,255,.7) 52%,
    rgba(255,255,255,.48) 58%,
    rgba(255,255,255,0) 100%);
  filter:blur(36px);
  animation:bandFloat 52s ease-in-out infinite;
}
@keyframes bandFloat{
  0%,100%{top:8%;opacity:.42;}
  50%{top:58%;opacity:.76;}
}

/* ---------- ④ 电商数据场景 ---------- */
.scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}

.scene .dots{animation:dotsBreath 16s ease-in-out infinite;}
@keyframes dotsBreath{0%,100%{opacity:.66;}50%{opacity:1;}}

/* 成交柱：起伏 */
.bar{
  transform-box:fill-box;transform-origin:bottom;
  animation:barPulse 6.8s ease-in-out infinite;
}
@keyframes barPulse{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.66);}}
.bar:nth-of-type(1){animation-delay:0s;}
.bar:nth-of-type(2){animation-delay:-1.2s;}
.bar:nth-of-type(3){animation-delay:-2.4s;}
.bar:nth-of-type(4){animation-delay:-3.6s;}
.bar:nth-of-type(5){animation-delay:-4.8s;}
.bar:nth-of-type(6){animation-delay:-6s;}
.bar:nth-of-type(7){animation-delay:-.7s;}

/* 增长曲线：循环描画 */
.curve{
  stroke-dasharray:100 110;stroke-dashoffset:100;
  animation:draw 11s cubic-bezier(.42,.06,.5,.96) infinite;
}
@keyframes draw{
  0%{stroke-dashoffset:100;opacity:1;}
  46%{stroke-dashoffset:0;opacity:1;}
  72%{stroke-dashoffset:-40;opacity:1;}
  88%{stroke-dashoffset:-110;opacity:0;}
  100%{stroke-dashoffset:-110;opacity:0;}
}

/* 商品立方体：浮动 + 轻微摆动 */
.cube{animation:cubeFloat 9.5s ease-in-out infinite;}
.cube--b{animation-duration:12s;animation-delay:-3.4s;}
.cube--c{animation-duration:8s;animation-delay:-1.8s;}
.cube--d{animation-duration:10.5s;animation-delay:-5s;}
@keyframes cubeFloat{
  0%,100%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-18px) rotate(2deg);}
}

/* ---------- ⑤ 斜向高光 ---------- */
.sheen{
  top:-50%;left:-75%;width:250%;height:200%;
  background:linear-gradient(106deg,
    rgba(255,255,255,0) 34%,
    rgba(255,255,255,.46) 45%,
    rgba(255,255,255,.86) 50%,
    rgba(255,255,255,.46) 55%,
    rgba(255,255,255,0) 66%);
  filter:blur(46px);
  animation:sheenMove 56s ease-in-out infinite;
}
@keyframes sheenMove{
  0%,100%{transform:translate3d(-22%,0,0);opacity:.38;}
  50%{transform:translate3d(22%,8%,0);opacity:.9;}
}

/* ---------- ⑥ 颗粒抖动 ---------- */
.grain{
  inset:-60%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)' opacity='.65'/></svg>");
  opacity:.34;
  mix-blend-mode:overlay;
  animation:grainShift 7s steps(1) infinite;
}
@keyframes grainShift{
  0%{transform:translate3d(0,0,0);}
  14%{transform:translate3d(-2.5%,-3%,0);}
  28%{transform:translate3d(3%,1.5%,0);}
  42%{transform:translate3d(-1.5%,3%,0);}
  57%{transform:translate3d(2.5%,-2%,0);}
  71%{transform:translate3d(-3%,1%,0);}
  85%{transform:translate3d(1.5%,2.5%,0);}
  100%{transform:translate3d(0,0,0);}
}

/* ---------- ⑦ 暗角 ---------- */
.vignette{
  inset:0;
  background:radial-gradient(120% 100% at 46% 44%, rgba(255,255,255,0) 40%, rgba(54,64,80,.22) 100%);
}

@media (prefers-reduced-motion:reduce){
  .stage *{animation:none!important;}
}
</style>
</head>
<body>
  <div class="stage" aria-hidden="true">

    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
    <span class="blob blob--4"></span>
    <span class="blob blob--5"></span>
    <span class="band"></span>

    <!-- ==================== 电商运营数据场景 ==================== -->
    <svg class="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" fill="none">
      <defs>
        <linearGradient id="barFill" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#ffffff" stop-opacity=".18"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity=".84"/>
        </linearGradient>
        <linearGradient id="trendStroke" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#48525f" stop-opacity=".14"/>
          <stop offset="50%" stop-color="#48525f" stop-opacity=".52"/>
          <stop offset="100%" stop-color="#047857" stop-opacity=".85"/>
        </linearGradient>
        <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
          <circle cx="2.8" cy="2.8" r="1.3" fill="#414b5b" opacity=".17"/>
        </pattern>
      </defs>

      <!-- 数据网格 -->
      <rect class="dots" x="0" y="0" width="1920" height="1080" fill="url(#dotGrid)"/>

      <!-- ---------- 成交柱状图（左下）---------- -->
      <line x1="120" y1="880" x2="620" y2="880" stroke="#414b5b" stroke-opacity=".16" stroke-width="1"/>
      <g stroke="#414b5b" stroke-opacity=".20" stroke-width="1">
        <rect class="bar" x="140" y="770" width="34" height="110" rx="5" fill="url(#barFill)"/>
        <rect class="bar" x="200" y="710" width="34" height="170" rx="5" fill="url(#barFill)"/>
        <rect class="bar" x="260" y="742" width="34" height="138" rx="5" fill="url(#barFill)"/>
        <rect class="bar" x="320" y="660" width="34" height="220" rx="5" fill="url(#barFill)"/>
        <rect class="bar" x="380" y="694" width="34" height="186" rx="5" fill="url(#barFill)"/>
        <rect class="bar" x="440" y="630" width="34" height="250" rx="5" fill="url(#barFill)"/>
        <rect class="bar" x="500" y="675" width="34" height="205" rx="5" fill="url(#barFill)"/>
      </g>

      <!-- ---------- 指标环（中央）---------- -->
      <g>
        <circle cx="960" cy="520" r="182" stroke="#414b5b" stroke-opacity=".20" stroke-width="9"
                pathLength="144" stroke-dasharray="1.2 10.8">
          <animateTransform attributeName="transform" type="rotate" from="0 960 520" to="-360 960 520"
                            dur="78s" repeatCount="indefinite"/>
        </circle>
        <circle cx="960" cy="520" r="152" stroke="#414b5b" stroke-opacity=".12" stroke-width="1.8"/>
        <circle cx="960" cy="520" r="152" stroke="#047857" stroke-opacity=".60"
                stroke-width="3.2" stroke-linecap="round" pathLength="100" stroke-dasharray="66 100">
          <animateTransform attributeName="transform" type="rotate" from="-90 960 520" to="270 960 520"
                            dur="17s" repeatCount="indefinite"/>
        </circle>
        <circle cx="960" cy="520" r="108" stroke="#414b5b" stroke-opacity=".10" stroke-width="1.3"/>
        <circle cx="960" cy="520" r="5" fill="#047857" opacity=".45"/>
      </g>

      <!-- ---------- 趋势曲线（右侧，对比线 + 主增长线 + 数据点）---------- -->
      <path d="M 1150 745 C 1300 715, 1360 625, 1450 585 S 1620 465, 1700 395 C 1740 360, 1770 340, 1800 325"
            stroke="#48525f" stroke-opacity=".18" stroke-width="1.8" stroke-linecap="round"
            stroke-dasharray="8 10"/>
      <path id="trend" class="curve" pathLength="100"
            d="M 1150 800 C 1300 768, 1360 678, 1450 638 S 1620 518, 1700 448 C 1740 413, 1770 393, 1800 378"
            stroke="url(#trendStroke)" stroke-width="3.4" stroke-linecap="round"/>
      <g fill="#ffffff" stroke="#48525f" stroke-opacity=".38" stroke-width="1.6">
        <circle cx="1450" cy="638" r="4.6"/>
        <circle cx="1700" cy="448" r="4.6"/>
      </g>
      <circle r="5" fill="#047857">
        <animateMotion dur="11s" repeatCount="indefinite">
          <mpath href="#trend"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.16;.78;1"
                 dur="11s" repeatCount="indefinite"/>
      </circle>

      <!-- ---------- 商品 / 包裹立方体 ---------- -->
      <g transform="translate(320,250) scale(1.5)">
        <g class="cube">
          <path d="M 0,-26 L 20,-16 L 0,-6 L -20,-16 Z" fill="#ffffff" fill-opacity=".88"
                stroke="#414b5b" stroke-opacity=".30" stroke-width=".7" stroke-linejoin="round"/>
          <path d="M 20,-16 L 0,-6 L 0,16 L 20,6 Z" fill="#ffffff" fill-opacity=".60"
                stroke="#414b5b" stroke-opacity=".30" stroke-width=".7" stroke-linejoin="round"/>
          <path d="M -20,-16 L 0,-6 L 0,16 L -20,6 Z" fill="#ffffff" fill-opacity=".38"
                stroke="#414b5b" stroke-opacity=".30" stroke-width=".7" stroke-linejoin="round"/>
          <line x1="-20" y1="-16" x2="20" y2="-16" stroke="#047857" stroke-opacity=".34" stroke-width=".8"/>
        </g>
      </g>

      <g transform="translate(1570,210) scale(1.1)">
        <g class="cube cube--b">
          <path d="M 0,-26 L 20,-16 L 0,-6 L -20,-16 Z" fill="#ffffff" fill-opacity=".92"
                stroke="#047857" stroke-opacity=".40" stroke-width=".8" stroke-linejoin="round"/>
          <path d="M 20,-16 L 0,-6 L 0,16 L 20,6 Z" fill="#047857" fill-opacity=".16"
                stroke="#047857" stroke-opacity=".40" stroke-width=".8" stroke-linejoin="round"/>
          <path d="M -20,-16 L 0,-6 L 0,16 L -20,6 Z" fill="#047857" fill-opacity=".09"
                stroke="#047857" stroke-opacity=".40" stroke-width=".8" stroke-linejoin="round"/>
          <line x1="-20" y1="-16" x2="20" y2="-16" stroke="#047857" stroke-opacity=".45" stroke-width=".9"/>
        </g>
      </g>

      <g transform="translate(1270,190) scale(.78)">
        <g class="cube cube--c">
          <path d="M 0,-26 L 20,-16 L 0,-6 L -20,-16 Z" fill="#ffffff" fill-opacity=".86"
                stroke="#414b5b" stroke-opacity=".28" stroke-width=".8" stroke-linejoin="round"/>
          <path d="M 20,-16 L 0,-6 L 0,16 L 20,6 Z" fill="#ffffff" fill-opacity=".56"
                stroke="#414b5b" stroke-opacity=".28" stroke-width=".8" stroke-linejoin="round"/>
          <path d="M -20,-16 L 0,-6 L 0,16 L -20,6 Z" fill="#ffffff" fill-opacity=".34"
                stroke="#414b5b" stroke-opacity=".28" stroke-width=".8" stroke-linejoin="round"/>
        </g>
      </g>

      <g transform="translate(700,880) scale(.72)">
        <g class="cube cube--d">
          <path d="M 0,-26 L 20,-16 L 0,-6 L -20,-16 Z" fill="#ffffff" fill-opacity=".86"
                stroke="#414b5b" stroke-opacity=".28" stroke-width=".9" stroke-linejoin="round"/>
          <path d="M 20,-16 L 0,-6 L 0,16 L 20,6 Z" fill="#ffffff" fill-opacity=".56"
                stroke="#414b5b" stroke-opacity=".28" stroke-width=".9" stroke-linejoin="round"/>
          <path d="M -20,-16 L 0,-6 L 0,16 L -20,6 Z" fill="#ffffff" fill-opacity=".34"
                stroke="#414b5b" stroke-opacity=".28" stroke-width=".9" stroke-linejoin="round"/>
        </g>
      </g>
    </svg>

    <span class="sheen"></span>
    <span class="grain"></span>
    <span class="vignette"></span>
  </div>
</body>
</html>
